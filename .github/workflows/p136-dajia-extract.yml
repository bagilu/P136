name: P136 Dajia candidate extraction research
on:
  push:
    paths:
      - '.github/workflows/p136-dajia-extract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyshp==2.3.1
      - name: Extract Dajia candidate from official N4 monitoring seed (unverified hydrographic outlet)
        run: |
          python scripts/build_river_candidate.py \
            --slug dajia \
            --mouth-lon 120.5529 \
            --mouth-lat 24.3340833333 \
            --bbox 120.45 24.00 121.65 24.65
      - name: Validate candidate topology and provenance
        run: python scripts/validate_river_candidate.py data/candidates/dajia
      - name: Record source and research parameters
        if: success()
        run: |
          python - <<'PY'
          import json,pathlib
          d=pathlib.Path('data/candidates/dajia')
          (d/'research-input.json').write_text(json.dumps({
            'source_url':'https://www.iot.gov.tw/uploads/asset/data/6619bd49367376304acd5200/B0993870.pdf',
            'source_station':'N4 Dajia River estuary water-quality sampling location',
            'mouth_seed':[120.5529,24.3340833333],
            'bbox':[120.45,24.00,121.65,24.65],
            'mouth_seed_verified':False,
            'geographic_identity_verified':False,
            'basin_boundary_verified':False,
            'publication_authorized':False
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Upload candidate review package (never publish automatically)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p136-dajia-candidate-review
          path: data/candidates/dajia/
          if-no-files-found: warn
          retention-days: 30
