name: P136 Official Centerline Review Pipeline
on:
  push:
    paths:
      - 'scripts/run_official_centerline_review.py'
      - 'tests/test_centerline_review_pipeline.py'
      - '.github/workflows/p136-centerline-review-pipeline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyshp==2.3.1 "shapely>=2,<3" "pyproj>=3,<4"
      - run: python -m unittest discover -s tests -p test_centerline_review_pipeline.py -v
