name: P136 V0.019 Quality Gate
on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'index.html'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.cjs'
      - '.github/workflows/p136-quality.yml'
      - 'data/published/**'
      - 'data/candidates/lanyang/**'
      - 'data/catalog/**'
  pull_request:
    paths:
      - 'assets/**'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/p136-quality.yml'
      - 'data/published/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate website syntax and simulation conservation
        run: node tests/p136-smoke.cjs
      - name: Validate V0.019 bilingual confluence explorer
        run: node tests/p136-v019-smoke.cjs
      - name: Validate published network and area metadata
        run: python3 tests/p136-data-check.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser-test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Execute real-browser E2E checks
        run: npm run test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p136-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
