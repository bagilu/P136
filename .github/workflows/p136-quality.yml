name: P136 V0.015 Quality Gate
on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/p136-quality.yml'
      - 'data/published/**'
  pull_request:
    paths:
      - 'assets/**'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/p136-quality.yml'
      - 'data/published/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate website syntax and simulation conservation
        run: node tests/p136-smoke.cjs
      - name: Validate published network and area metadata
        run: python3 tests/p136-data-check.py
