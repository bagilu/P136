name: P136 River System Auto Discovery
on:
  push:
    branches: [main]
    paths:
      - 'data/rivers/*.geojson'
      - 'scripts/build_river_system_index.py'
      - '.github/workflows/p136-river-system-index.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: p136-river-system-index
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and build published river catalog
        run: python scripts/build_river_system_index.py
      - name: Commit catalog if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rivers/index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(P136): refresh published river system registry"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
