name: P136 V0.008 HydroRIVERS field audit
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: p136-data-publish
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install shapefile reader
        run: python -m pip install pyshp==2.3.1
      - name: Audit source fields against exact original SHA256
        run: python scripts/audit_tamsui_fields.py
      - name: Publish field audit report only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published/tamsui-field-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(P136): audited HydroRIVERS field metadata"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
