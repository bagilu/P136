name: P136 V0.005 HydroRIVERS topology candidate
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: p136-data-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install shapefile reader
        run: python -m pip install pyshp==2.3.1
      - name: Download HydroRIVERS and validate directed topology
        run: python scripts/build_tamsui_network.py
      - name: Commit validated candidate without force push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published/tamsui-network.geojson data/published/tamsui-network-manifest.json data/published/tamsui-network-validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(P136): preliminary directed Tamsui river network"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
