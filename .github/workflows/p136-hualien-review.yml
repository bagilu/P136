name: P136 Hualien River candidate review
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/p136-hualien-review.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyshp==2.3.1
      - name: Extract Hualien River candidate (unverified mouth seed)
        run: python scripts/build_river_candidate.py --slug hualien --mouth-lon 121.610423 --mouth-lat 23.936261 --bbox 120.85 23.30 121.80 24.20
      - name: Check generated candidate files
        run: |
          python - <<'PY'
          import json,pathlib
          d=pathlib.Path('data/candidates/hualien')
          m=json.loads((d/'network-manifest.json').read_text())
          v=json.loads((d/'network-validation.json').read_text())
          assert m['published_sha256']==v['output_sha256']
          assert m['basin_boundary_verified'] is False
          assert v['cycles']==0 and v['dangling_downstream_links']==0
          print('Review-only candidate:',m['feature_count'],'reaches')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p136-hualien-candidate-review
          path: data/candidates/hualien/
          retention-days: 30
