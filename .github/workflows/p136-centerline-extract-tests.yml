name: P136 Official Centerline Extraction Tests
on:
  push:
    paths:
      - 'scripts/extract_official_centerlines.py'
      - 'tests/test_extract_official_centerlines.py'
      - '.github/workflows/p136-centerline-extract-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyshp==2.3.1 "shapely>=2,<3" "pyproj>=3,<4"
      - run: python -m unittest discover -s tests -p test_extract_official_centerlines.py -v
