name: P136 Official Vector Archive Audit Tests
on:
  push:
    paths:
      - 'scripts/audit_official_vector_archive.py'
      - 'tests/test_official_archive_audit.py'
      - '.github/workflows/p136-official-archive-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyshp==2.3.1
      - run: python -m unittest discover -s tests -p test_official_archive_audit.py -v
