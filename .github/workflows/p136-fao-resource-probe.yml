name: P136 FAO River Resource Probe
on:
  push:
    paths:
      - 'scripts/probe_fao_rivers_resources.py'
      - '.github/workflows/p136-fao-resource-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/probe_fao_rivers_resources.py --output reports/fao-river-resources.json
      - uses: actions/upload-artifact@v4
        with:
          name: p136-fao-resource-metadata
          path: reports/fao-river-resources.json
          retention-days: 30
