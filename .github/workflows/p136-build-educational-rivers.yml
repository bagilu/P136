name: P136 Build Taiwan Educational Rivers
on:
  push:
    paths:
      - 'scripts/build_osm_taiwan_educational.py'
      - 'scripts/build_osm_taiwan_from_pbf.py'
      - '.github/workflows/p136-build-educational-rivers.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OSM PBF reader
        run: python -m pip install osmium==4.1.1
      - name: Download and build OSM named rivers from Taiwan extract
        run: python scripts/build_osm_taiwan_from_pbf.py --output data/educational/taiwan-named-rivers.geojson
      - name: Commit generated educational river data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/educational/taiwan-named-rivers.geojson
          if git diff --cached --quiet; then echo "No data changes"; else
            git commit -m "data(P136): publish OSM ODbL educational Taiwan named river lines"
            git push
          fi
