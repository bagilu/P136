name: P136 V0.018 Lanyang candidate extraction
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: p136-lanyang-candidate
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned shapefile parser
        run: python -m pip install pyshp==2.3.1
      - name: Extract and validate preliminary Lanyang candidate
        run: python scripts/build_lanyang_candidate.py
      - name: Verify candidate output exists before publication
        run: |
          test -s data/candidates/lanyang/network.geojson
          test -s data/candidates/lanyang/network-manifest.json
          test -s data/candidates/lanyang/network-validation.json
          test -s data/candidates/lanyang/network-index.json
          test -s data/candidates/lanyang/area-index.json
          test -s data/candidates/lanyang/area-validation.json
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('data/candidates/lanyang')
          m=json.loads((p/'network-manifest.json').read_text())
          v=json.loads((p/'network-validation.json').read_text())
          assert m['feature_count']>=10
          assert m['published_sha256']==v['output_sha256']
          assert m['basin_boundary_verified'] is False
          print('Lanyang candidate ready for manual review:',m['feature_count'],'reaches')
          PY
      - name: Publish candidate files for manual review only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates/lanyang/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(P136): Lanyang preliminary candidate for manual review"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
