name: P136 validated static hydrography
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_tamsui.py'
      - '.github/workflows/p136-data.yml'
permissions:
  contents: write
jobs:
  build:
    concurrency:
      group: p136-data-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate geometry
        run: python scripts/build_tamsui.py
      - name: Commit published dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published/tamsui.geojson data/published/manifest.json data/published/validation-report.json
          if git diff --cached --quiet; then
            echo "No dataset changes to publish"
            exit 0
          fi
          git commit -m "data(P136): publish validated Tamsui geometry and provenance"
          # Another contributor may have updated main after checkout.
          # Rebase preserves those commits; never force-push.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Dataset published successfully"
              exit 0
            fi
            echo "Concurrent main update; retrying ($attempt/5)"
            sleep 2
          done
          echo "::error::Could not publish after five safe retries"
          exit 1
