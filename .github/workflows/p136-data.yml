name: P136 validated static hydrography
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_tamsui.py'
      - '.github/workflows/p136-data.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate geometry
        run: python scripts/build_tamsui.py
      - name: Commit published dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published/tamsui.geojson data/published/manifest.json data/published/validation-report.json
          git diff --cached --quiet || (git commit -m "data(P136): publish validated Tamsui geometry and provenance" && git push)
