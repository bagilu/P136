name: P136 V0.008 preliminary catchment areas
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: p136-data-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install shapefile reader
        run: python -m pip install pyshp==2.3.1
      - name: Extract and audit local and cumulative areas
        run: python scripts/build_tamsui_area_index.py
      - name: Publish source-preliminary area index and validation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published/tamsui-area-index.json data/published/tamsui-area-validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(P136): preliminary local and cumulative catchment area audit"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
